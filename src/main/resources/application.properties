# --- Database (Neon PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

# --- Server ---
server.port=${PORT:8081}

# --- Resend (email) ---
resend.api-key=${RESEND_API_KEY}
resend.base-url=https://api.resend.com/emails
resend.from-email=noreply@contact.vativahub.com
resend.from-name=Vativa Hub LMS

# --- App / Invite ---
app.invite.expiry-minutes=4320
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}

# --- Password Reset Link ---
reset-link.base-url=${RESET_LINK_BASE_URL:http://localhost:4200/reset-password}
reset-link.expiry-minutes=30

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Cloudinary ---
app.cloudinary.url=${CLOUDINARY_URL:}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Payment ---
payment.test-mode=${PAYMENT_TEST_MODE:true}

# --- Uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=10MB